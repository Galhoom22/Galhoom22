<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="Abdelrahman Galhoom profile map">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="920" height="520" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="872" height="472" rx="22" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="460" y="78" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Abdelrahman Galhoom</text>
  <text x="460" y="112" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Software Engineer  ·  Backend Specialist  ·  Egypt</text>
  <rect x="360" y="128" width="200" height="4" rx="2" fill="url(#accent)"/>

  <!-- Detective line -->
  <text x="460" y="168" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Detective mindset on backends  find the cause, keep it clear, ship the product</text>

  <!-- T-shaped visual -->
  <g filter="url(#soft)">
    <!-- stem -->
    <rect x="430" y="220" width="60" height="150" rx="10" fill="#0d9488"/>
    <!-- bar -->
    <rect x="250" y="200" width="420" height="52" rx="12" fill="#155e75"/>
  </g>
  <text x="460" y="233" text-anchor="middle" fill="#ecfeff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">T-SHAPED</text>
  <text x="460" y="310" text-anchor="middle" fill="#f0fdfa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">BACKEND</text>
  <text x="460" y="332" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">PHP · Laravel · APIs · Data</text>
  <text x="280" y="232" text-anchor="middle" fill="#a5f3fc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Product</text>
  <text x="640" y="232" text-anchor="middle" fill="#a5f3fc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Frontend / Ops</text>

  <!-- Product engineer chip -->
  <rect x="300" y="390" width="320" height="42" rx="21" fill="#1e293b" stroke="#14b8a6" stroke-width="2"/>
  <text x="460" y="417" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Product-engineer mindset</text>

  <!-- Footer -->
  <text x="460" y="470" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Galhoom Path  ’  Study  ·  Problem Solving  ·  Interview Prep</text>
</svg>
